<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact YNG Archive for bookings and enquiries." />
  <title>Contact — YNG Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/logo-main.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><span class="logo-mark" role="img" aria-label="YNG Archive"></span></a>

  <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
    <span></span><span></span>
  </button>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
    <div class="nav-socials">
      <a href="https://www.instagram.com/yng.archive.co/" target="_blank" rel="noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </a>
      <a href="https://www.facebook.com/yngarchive" target="_blank" rel="noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.2h2.4l.36-2.8h-2.76V9.1c0-.81.22-1.36 1.39-1.36h1.48V5.23A19.8 19.8 0 0 0 14.2 5c-2.15 0-3.62 1.31-3.62 3.72v2.28H8.1v2.8h2.48V21h2.92z"/></svg>
      </a>
    </div>
  </nav>
</header>

<main>
  <section class="page-hero">
    <p class="eyebrow">Contact</p>
    <h1>Have something in mind?</h1>
    <p>Tell me what you're planning, where it is and what kind of photos you need — I'll get back to you with availability and a quote.</p>
  </section>

  <section class="section-pad">
    <div class="contact-page-grid">

      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="ea925039-ba27-409b-a7a0-34c502dc7ff0">
        <input type="hidden" name="subject" value="New enquiry from YNG Archive site">
        <input type="checkbox" name="botcheck" class="botcheck" style="display:none;" tabindex="-1" autocomplete="off">

        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone <span style="text-transform:none; letter-spacing:normal;">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
        </div>
        <div class="field">
          <label for="job-type">What's the job?</label>
          <input id="job-type" name="job-type" type="text" placeholder="e.g. live show, event, portrait session">
        </div>
        <div class="field">
          <label for="message">Details</label>
          <textarea id="message" name="message" placeholder="Date, location, what you need covered..." required></textarea>
        </div>
        <button class="contact-submit" type="submit">Send enquiry</button>
      </form>

      <div class="contact-direct">
        <h2>Direct</h2>
        <div class="contact-direct-links">
          <a href="mailto:trent@yngarchive.com">trent@yngarchive.com</a>
          <a href="https://www.instagram.com/yng.archive.co/" target="_blank" rel="noreferrer">Instagram ↗</a>
          <a href="https://www.facebook.com/yngarchive" target="_blank" rel="noreferrer">Facebook ↗</a>
        </div>
      </div>

    </div>
  </section>
</main>

<footer>
  <a class="brand" href="index.html"><span class="logo-mark" role="img" aria-label="YNG Archive"></span></a>
  <p>© <span class="year"></span> Trent Young</p>
</footer>
<script src="script.js"></script>
</body></html>
