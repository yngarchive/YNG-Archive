  <link rel="icon" type="image/svg+xml" href="assets/logo-main.svg" />

</head>
<body>

<div class="page-shell">
<header class="site-header">
  <a class="brand" href="index.html"><span class="logo-mark" role="img" aria-label="YNG Archive"></span></a>

  <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
    <span></span><span></span>
  </button>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <div class="nav-socials">
      <a href="https://www.instagram.com/yng.archive.co/" target="_blank" rel="noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </a>
      <a href="https://www.facebook.com/yngarchive" target="_blank" rel="noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.2h2.4l.36-2.8h-2.76V9.1c0-.81.22-1.36 1.39-1.36h1.48V5.23A19.8 19.8 0 0 0 14.2 5c-2.15 0-3.62 1.31-3.62 3.72v2.28H8.1v2.8h2.48V21h2.92z"/></svg>
      </a>
    </div>
  </nav>
</header>

<main>
  <section class="page-hero gallery-hero">
    <a class="back-link" href="gallery.html">← All galleries</a>
    <p class="eyebrow">Gallery folder</p>
    <h1>Events</h1>
    <p>Nightlife, festivals, private functions and community gatherings.</p>
    <p class="gallery-hint">Choose a photo to explore the full album.</p>
  </section>

  <section class="work section-pad">
    <div class="photo-grid" id="gallery-mount" data-category="events" data-captions="false"></div>
  </section>
</main>

<footer>
  <a class="brand" href="index.html"><span class="logo-mark" role="img" aria-label="YNG Archive"></span></a>
  <p>© <span class="year"></span> Trent Young</p>
</footer>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
  <div class="lightbox-panel">
    <button type="button" class="lightbox-close" aria-label="Close album">&times;</button>
    <div class="lightbox-header">
      <h2 class="lightbox-title" id="lightbox-title"></h2>
      <p class="lightbox-meta"></p>
    </div>
    <div class="lightbox-grid"></div>
  </div>
</div>

<div class="image-viewer" id="image-viewer" role="dialog" aria-modal="true" aria-label="Full size photo">
  <button type="button" class="viewer-close" aria-label="Close">&times;</button>
  <button type="button" class="viewer-nav viewer-prev" aria-label="Previous photo">&larr;</button>
  <img class="viewer-image" src="" alt="">
  <button type="button" class="viewer-nav viewer-next" aria-label="Next photo">&rarr;</button>
</div>

<script src="script.js"></script>
